<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="theme.js"></script>
  <title>Dashboard - User Data Handler</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f5f7fb;
      --surface: #ffffff;
      --surface-hover: #f7f9fc;
      --text: #202124;
      --muted: #5f6368;
      --border: #d0d4da;
      --table-head: #f8f9fa;
      --table-border: #eee;
      --primary: #4285f4;
      --primary-hover: #357ae8;
      --secondary: #5f6368;
      --secondary-hover: #4f5357;
      --danger: #b3261e;
      --success: #137333;
      --shadow: rgba(0,0,0,.08);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #111827;
      --surface: #1f2937;
      --surface-hover: #273449;
      --text: #f3f4f6;
      --muted: #c5cad3;
      --border: #4b5563;
      --table-head: #273449;
      --table-border: #374151;
      --primary: #78a9ff;
      --primary-hover: #9cc0ff;
      --secondary: #6b7280;
      --secondary-hover: #7c8491;
      --danger: #ff8a80;
      --success: #7ee2a8;
      --shadow: rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    body{font-family:Arial,sans-serif;max-width:1000px;margin:0 auto;padding:24px;background:var(--page-bg);color:var(--text);transition:background-color .2s ease,color .2s ease}
    .top,.card{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px var(--shadow);transition:background-color .2s ease,box-shadow .2s ease}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
    input{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);outline:none}
    input::placeholder{color:var(--muted)}
    input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(66,133,244,.15)}
    button{border:0;border-radius:7px;padding:10px 16px;cursor:pointer;background:var(--primary);color:#fff}
    button:hover{background:var(--primary-hover)}
    button:disabled{opacity:.65;cursor:not-allowed}
    button.secondary{background:var(--secondary)}
    button.secondary:hover{background:var(--secondary-hover)}
    .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse;margin-top:14px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--table-border)}th{background:var(--table-head)}
    #msg{min-height:20px}.error{color:var(--danger)}.success{color:var(--success)}.muted{color:var(--muted)}

    .theme-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 4px 18px var(--shadow);
    }
    .theme-switcher button {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .theme-switcher button:hover, .theme-switcher button.active {
      background: var(--surface-hover);
      color: var(--text);
    }
    @media (max-width: 640px) {
      body { padding: 76px 12px 18px; }
      .top,.card { padding: 16px; }
      .theme-switcher { left: 50%; right: auto; transform: translateX(-50%); }
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <section class="top">
    <div><h1>User Data Handler</h1><p>Logged in as: <strong id="user-email"></strong></p></div>
    <button id="logout" class="secondary" type="button">Logout</button>
  </section>

  <section class="card">
    <h2>Add employee</h2>
    <form id="employee-form">
      <div class="grid">
        <div><label for="name">Name</label><input id="name" required maxlength="100"></div>
        <div><label for="employee_id">Employee ID</label><input id="employee_id" required maxlength="50"></div>
        <div><label for="department">Department</label><input id="department" required maxlength="100"></div>
        <div><label for="salary">Salary</label><input id="salary" required inputmode="decimal" maxlength="30"></div>
      </div>
      <div class="actions"><button id="save-btn" type="submit">Save employee</button></div>
    </form>
    <p id="msg" role="alert"></p>
  </section>

  <section class="card">
    <h2>Employee records</h2>
    <p class="muted">Records are stored in Firebase Firestore and are restricted to authenticated users by the recommended security rules.</p>
    <div id="records">Loading...</div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqMTkqnv7PbgMLFC1Dsr6xUC5F4Q5_cwk",
      authDomain: "user-data-handler.firebaseapp.com",
      projectId: "user-data-handler",
      storageBucket: "user-data-handler.firebasestorage.app",
      messagingSenderId: "86059970806",
      appId: "1:86059970806:web:de794abb0b5cded13b3cd7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const form = document.getElementById('employee-form');
    const msg = document.getElementById('msg');
    const records = document.getElementById('records');
    let unsubscribeRecords = null;

    const showMessage = (text, ok=false) => {
      msg.textContent = text;
      msg.className = ok ? 'success' : 'error';
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('user-email').textContent = user.email || 'Authenticated user';

      const employeeQuery = query(collection(db, 'employees'), orderBy('createdAt', 'desc'));
      unsubscribeRecords?.();
      unsubscribeRecords = onSnapshot(employeeQuery, (snapshot) => {
        if (snapshot.empty) { records.innerHTML = '<p class="muted">No employee records yet.</p>'; return; }
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Name</th><th>Employee ID</th><th>Department</th><th>Salary</th><th>Action</th></tr></thead>';
        const tbody = document.createElement('tbody');
        snapshot.forEach((item) => {
          const data = item.data();
          const tr = document.createElement('tr');
          for (const key of ['name','employee_id','department','salary']) {
            const td = document.createElement('td');
            td.textContent = data[key] ?? '';
            tr.appendChild(td);
          }
          const action = document.createElement('td');
          const del = document.createElement('button');
          del.textContent = 'Delete'; del.className = 'secondary';
          del.onclick = async () => {
            if (!confirm('Delete this employee record?')) return;
            try { await deleteDoc(doc(db, 'employees', item.id)); showMessage('Record deleted.', true); }
            catch (e) { showMessage(e.message); }
          };
          action.appendChild(del); tr.appendChild(action); tbody.appendChild(tr);
        });
        table.appendChild(tbody); records.replaceChildren(table);
      }, (error) => showMessage('Could not load records: ' + error.message));
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user) return;
      const data = {
        name: document.getElementById('name').value.trim(),
        employee_id: document.getElementById('employee_id').value.trim(),
        department: document.getElementById('department').value.trim(),
        salary: document.getElementById('salary').value.trim()
      };
      if (Object.values(data).some(v => !v)) { showMessage('All fields are required.'); return; }
      const button = document.getElementById('save-btn'); button.disabled = true;
      try {
        await addDoc(collection(db, 'employees'), { ...data, ownerUid: user.uid, createdAt: serverTimestamp() });
        form.reset(); showMessage('Employee saved successfully.', true);
      } catch (e) { showMessage('Could not save record: ' + e.message); }
      finally { button.disabled = false; }
    });

    document.getElementById('logout').onclick = async () => {
      try { await signOut(auth); } catch (e) { showMessage(e.message); }
    };
  </script>
</body>
</html>
