<!DOCTYPE html>
<html>
<head>
  <title>Login - User Data Handler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="theme.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f5f5f5;
      --surface: #ffffff;
      --surface-hover: #f7f9fc;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --primary: #4285f4;
      --primary-hover: #357ae8;
      --danger: #b3261e;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #111827;
      --surface: #1f2937;
      --surface-hover: #273449;
      --text: #f3f4f6;
      --muted: #c5cad3;
      --border: #4b5563;
      --primary: #78a9ff;
      --primary-hover: #9cc0ff;
      --danger: #ff8a80;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--page-bg); color: var(--text); margin: 0; padding: 24px; transition: background-color .2s ease, color .2s ease; }
    .box { background: var(--surface); padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px var(--shadow); width: min(100%, 380px); }
    h2 { margin-top: 0; text-align: center; }
    label { color: var(--text); }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); outline: none; }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(66, 133, 244, .15); }
    .box > button { width: 100%; padding: 12px; margin: 8px 0; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .box > button:hover { background: var(--primary-hover); }
    .box > button:disabled { opacity: .65; cursor: not-allowed; }
    #msg { text-align: center; color: var(--danger); font-size: 14px; min-height: 20px; }
    .toggle { text-align: center; margin-top: 15px; font-size: 14px; color: var(--primary); cursor: pointer; }

    .theme-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 4px 18px var(--shadow);
    }
    .theme-switcher button {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .theme-switcher button:hover, .theme-switcher button.active {
      background: var(--surface-hover);
      color: var(--text);
    }
    @media (max-width: 520px) {
      .theme-switcher { left: 50%; right: auto; transform: translateX(-50%); }
      body { padding-top: 76px; }
      .box { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="form-title">Login</h2>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" minlength="6">
    <button id="action-btn">Login</button>
    <p id="msg"></p>
    <div class="toggle" id="toggle">Need an account? Sign up</div>
  </div>

  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAqMTkqnv7PbgMLFC1Dsr6xUC5F4Q5_cwk",
      authDomain: "user-data-handler.firebaseapp.com",
      projectId: "user-data-handler",
      storageBucket: "user-data-handler.firebasestorage.app",
      messagingSenderId: "86059970806",
      appId: "1:86059970806:web:de794abb0b5cded13b3cd7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLogin = true;
    const title = document.getElementById('form-title');
    const btn = document.getElementById('action-btn');
    const toggle = document.getElementById('toggle');
    const msg = document.getElementById('msg');

    // If already logged in, go to dashboard
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    // Toggle Login / Sign Up
    toggle.onclick = () => {
      isLogin = !isLogin;
      title.innerText = isLogin ? 'Login' : 'Sign Up';
      btn.innerText = isLogin ? 'Login' : 'Sign Up';
      toggle.innerText = isLogin ? 'Need an account? Sign up' : 'Have an account? Login';
      msg.innerText = '';
    };

    // Handle Login or Sign Up
    btn.onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      msg.innerText = '';

      if (!email || !password) {
        msg.innerText = 'Please enter both email and password.';
        return;
      }
      if (password.length < 6) {
        msg.innerText = 'Password must be at least 6 characters.';
        return;
      }

      btn.disabled = true;
      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        // onAuthStateChanged will redirect
      } catch (error) {
        const code = error?.code || '';
        const messages = {
          'auth/invalid-credential': 'Invalid email or password.',
          'auth/email-already-in-use': 'An account with this email already exists.',
          'auth/invalid-email': 'Please enter a valid email address.',
          'auth/weak-password': 'Password must be at least 6 characters.'
        };
        msg.innerText = messages[code] || error.message.replace('Firebase: ', '');
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
